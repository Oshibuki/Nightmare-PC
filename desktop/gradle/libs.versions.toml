# Every version the desktop build uses is declared here and nowhere else --
# dependency coordinates in module build scripts must come from `libs.*`.
# `./gradlew build` resolves exactly these versions; there is no dynamic or
# `+` range anywhere in the build.
[versions]
# Product version. Single source of truth: :core generates a Kotlin constant
# from it and :cli prints that constant for `--version`, so the catalog and the
# binary can never disagree.
nightmare = "0.1.0"
kotlin = "2.4.21"
junit = "4.13.2"
json = "20250517"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
# The JVM artifact replaces Android's bundled org.json for the copied API layer.
json = { module = "org.json:json", version.ref = "json" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
