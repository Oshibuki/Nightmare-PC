# Desktop build settings. Deliberately separate from the repository-root
# gradle.properties: that one is sized for the Android build (4 GB heap,
# AndroidX flags) and shares nothing with this build.
#
# 1536 MB is enough for two small Kotlin modules and keeps an agent from
# starving the machine while a C++ engine build runs beside it.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
